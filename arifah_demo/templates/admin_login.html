{% extends "base.html" %}
{% block title %}Administrator sign in{% endblock %}
{% block content %}
<main class="center-wrap">
  <section class="panel">
    <h1>Administrator sign in</h1>
    <p class="small-note">Private controls for this demonstration website.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="admin-email">Email</label>
      <input class="field" id="admin-email" name="email" type="email" required autocomplete="username">
      <label for="admin-password">Password</label>
      <input class="field" id="admin-password" name="password" type="password" required autocomplete="current-password">
      <button class="primary-button" type="submit">Sign in</button>
    </form>
    <p class="small-note"><a href="{{ url_for('login') }}">Back to demo login</a></p>
  </section>
</main>
{% endblock %}
